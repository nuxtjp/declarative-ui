name: Product CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install declared package manager
        run: npm install --global pnpm@10.29.3 --ignore-scripts
      - name: Validate independent registry dependencies and module
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          node .github/scripts/package-consumer.mjs "$RUNNER_TEMP/nuxtjp-declarative-ui-0.10.0.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/nuxtjp-declarative-ui-0.10.0.tgz
          if-no-files-found: error
          retention-days: 7
