name: Product CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357cbb804a176991f5e02 # v4
        with:
          node-version: '24'
      - name: Install declared package manager
        run: npm install --global pnpm@10.29.3 --ignore-scripts
      - name: Validate independent registry dependencies and module
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm typecheck
          pnpm test
          pnpm build
          npm pack --ignore-scripts
